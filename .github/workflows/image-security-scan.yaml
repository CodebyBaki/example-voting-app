name: Image Security Scan

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/image-security-scan.yaml"

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.component }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: vote
            image: ghcr.io/codebybaki/example-voting-app-vote
          - component: result
            image: ghcr.io/codebybaki/example-voting-app-result
          - component: worker
            image: ghcr.io/codebybaki/example-voting-app-worker

    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ matrix.image }}:sha-fe14916
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

